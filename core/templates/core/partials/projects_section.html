<section id="projects" class="py-24 bg-darkBg relative overflow-hidden border-t border-white/5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-12">
            <div>
                <span class="text-maroon-glow font-mono text-xs uppercase tracking-widest font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-layer-group"></i> Featured Projects
                </span>
                <h2 class="font-syne text-3xl sm:text-5xl font-bold text-white mt-2">
                    Selected Masterpieces
                </h2>
            </div>
            <a href="{% url 'core:projects' %}" class="mt-6 md:mt-0 px-6 py-3 rounded-xl glass-card border border-white/10 text-white hover:border-maroon-glow hover:text-maroon-glow transition-all flex items-center gap-2 w-fit">
                <span>View All Projects</span> <i class="fa-solid fa-arrow-right"></i>
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            {% for project in projects %}
                {% include "core/partials/project_card.html" %}
            {% empty %}
            <p class="text-gray-400 col-span-full text-center">Projects will appear here once added from the admin panel.</p>
            {% endfor %}
        </div>
    </div>
</section>
