{% load static %}
<header class="sticky top-0 z-40 w-full backdrop-blur-xl bg-darkBg/80 border-b border-white/10 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-20">
            <!-- Brand Logo & Name -->
<a href="{% url 'core:home' %}" class="flex items-center gap-3 group">
<img src="/media/images/tecnsol1.png" 
     alt="Tecnsol" 
     class="h-10 sm:h-12 w-auto object-contain group-hover:scale-105 transition-transform duration-300">
    <!-- <div class="flex flex-col">
        <span class="font-syne text-2xl font-extrabold tracking-wider text-white">TECNSOL</span>
        <span class="text-[9px] uppercase tracking-[0.25em] text-gray-400 font-mono -mt-1">Digital Agency</span>
    </div> -->
</a>

            <!-- Desktop Navigation Links: each item is its own page -->
            <nav class="hidden md:flex items-center space-x-1 lg:space-x-2">
                <a href="{% url 'core:home' %}" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all flex items-center gap-2 hover-shake {% if active_nav == 'home' %}nav-active{% endif %}">
                    <i class="fa-solid fa-house-laptop text-maroon-glow text-xs"></i> Home
                </a>
               
             
                <a href="{% url 'core:projects' %}" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all flex items-center gap-2 hover-shake {% if active_nav == 'projects' %}nav-active{% endif %}">
                    <i class="fa-solid fa-code-merge text-maroon-glow text-xs"></i> Projects
                </a>
                <a href="{% url 'core:tech_stack' %}" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all flex items-center gap-2 hover-shake {% if active_nav == 'tech-stack' %}nav-active{% endif %}">
                    <i class="fa-solid fa-microchip text-maroon-glow text-xs"></i> Tech Stack
                </a>
                <!-- <a href="{% url 'core:testimonials' %}" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all flex items-center gap-2 hover-shake {% if active_nav == 'testimonials' %}nav-active{% endif %}">
                    <i class="fa-solid fa-comments text-maroon-glow text-xs"></i> Reviews
                </a> -->
                   <a href="{% url 'core:services' %}" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all flex items-center gap-2 hover-shake {% if active_nav == 'services' %}nav-active{% endif %}">
                    <i class="fa-solid fa-cubes text-maroon-glow text-xs"></i> Courses
                </a>
                 <a href="{% url 'core:about' %}" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all flex items-center gap-2 hover-shake {% if active_nav == 'about' %}nav-active{% endif %}">
                    <i class="fa-solid fa-people-group text-maroon-glow text-xs"></i> About Us
                </a>
                <a href="{% url 'core:contact' %}" class="px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-white/5 transition-all flex items-center gap-2 hover-shake {% if active_nav == 'contact' %}nav-active{% endif %}">
                    <i class="fa-solid fa-paper-plane text-maroon-glow text-xs"></i> Contact
                </a>
            </nav>

            <!-- Action Button -->
            <div class="hidden sm:flex items-center gap-3">
                <a href="{% url 'core:contact' %}" class="relative group overflow-hidden rounded-xl p-[1px] font-semibold text-xs uppercase tracking-wider">
                    <span class="absolute inset-0 bg-gradient-to-r from-maroon via-maroon-glow to-white animate-pulse"></span>
                    <span class="relative block px-5 py-2.5 rounded-[11px] bg-darkBg text-white transition-all group-hover:bg-transparent group-hover:text-white flex items-center gap-2">
                        <span>Get Estimate</span>
                        <i class="fa-solid fa-arrow-right-long text-maroon-glow group-hover:translate-x-1 group-hover:text-white transition-all"></i>
                    </span>
                </a>
            </div>

            <!-- Mobile Menu Button -->
            <button id="mobileMenuBtn" class="md:hidden text-gray-300 hover:text-white p-2 rounded-lg focus:outline-none" aria-label="Toggle Menu">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Animated Laser Line Beneath Navbar -->
    <div class="relative w-full h-[2px] bg-darkBorder/60 overflow-hidden">
        <div class="laser-beam"></div>
    </div>

    <!-- Mobile Navigation Menu Dropdown -->
    <div id="mobileMenu" class="hidden md:hidden bg-darkBg/95 border-b border-white/10 px-4 pt-3 pb-6 space-y-2">
        <a href="{% url 'core:home' %}" class="mobile-link block px-4 py-3 rounded-xl text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-3">
            <i class="fa-solid fa-house-laptop text-maroon-glow"></i> Home
        </a>
       
        <a href="{% url 'core:services' %}" class="mobile-link block px-4 py-3 rounded-xl text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-3">

        <a href="{% url 'core:projects' %}" class="mobile-link block px-4 py-3 rounded-xl text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-3">
            <i class="fa-solid fa-code-merge text-maroon-glow"></i> Projects
        </a>
        <a href="{% url 'core:tech_stack' %}" class="mobile-link block px-4 py-3 rounded-xl text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-3">

         <a href="{% url 'core:about' %}" class="mobile-link block px-4 py-3 rounded-xl text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-3">
            <i class="fa-solid fa-people-group text-maroon-glow"></i> About Us
        </a>
        <!-- <a href="{% url 'core:testimonials' %}" class="mobile-link block px-4 py-3 rounded-xl text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-3">
            <i class="fa-solid fa-comments text-maroon-glow"></i> Reviews
        </a> -->
        <a href="{% url 'core:contact' %}" class="mobile-link block px-4 py-3 rounded-xl text-base font-medium text-gray-300 hover:bg-white/5 hover:text-white flex items-center gap-3">
            <i class="fa-solid fa-paper-plane text-maroon-glow"></i> Contact
        </a>

</header>
